[project]
name = "session-bridge"
version = "0.0.1"
description = "Move a coding-CLI session (Claude / Codex / Gemini) into another CLI's history so you can --resume it natively."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
session-bridge = "session_bridge.cli:main"
sb = "session_bridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
